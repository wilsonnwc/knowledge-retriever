# Render Blueprint for the hosted Today page (backend/today_app.py).
# Dashboard: New → Blueprint → pick this repo. Secrets marked sync:false are entered in the dashboard
# (values are in your local .env: DATABASE_URL, APP_PASSWORD, SECRET_KEY) — never committed here.
services:
  - type: web
    name: knowledge-retriever-today
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements-today.txt && npm --prefix frontend ci && REACT_APP_API_URL=/api npm --prefix frontend run build
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT --workers 2 today_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
